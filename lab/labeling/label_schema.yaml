schema_version: "0.1"
labels:
  benign:
    title: Нормальная активность
    description: Обычный лабораторный трафик без признаков контролируемого сценария атак.
  port_scan:
    title: Сканирование портов
    description: Контролируемая проверка внутренних портов из перечня разрешённых значений.
  auth_failures:
    title: Ошибки авторизации
    description: Ограниченная серия неуспешных входов на тестовой учетной записи.
  web_probe:
    title: Диагностическая проверка веб-службы
    description: Безопасные диагностические обращения к веб-службе без вредоносной полезной нагрузки.
  low_rate_dos:
    title: Низкоинтенсивный всплеск трафика
    description: Лабораторная имитация краткого роста числа запросов с жесткими лимитами.
  beacon_simulation:
    title: Имитация маячкового обмена
    description: Периодические обращения к внутреннему управляющему программному интерфейсу.
required_event_fields:
  - timestamp
  - source_ip
  - destination_ip
  - source_role
  - target_role
  - protocol
  - event_source
  - scenario_id
  - label
