purpose: Слепая рольово-разделённая внутренняя лабораторная проверка допущенного proposal на новом синтетическом контрольном пакете.
claim_limits:
  - Не является независимой человеческой проверкой без отдельного reviewer.
  - Не является внешним испытанием или подтверждением production-готовности.
  - Не регистрирует proposal как candidate и не изменяет active candidate.
roles:
  - control_data_custodian
  - inference_operator
  - evaluation_operator
  - validation_reviewer
  - observer
independence:
  allowed_statuses: [role_separated_blind, independent_human_review, independence_not_established]
  default_without_external_person: role_separated_blind
  independent_human_review_requires_distinct_person: true
access_control:
  capability_tokens: separate_opaque_runtime_tokens
  administrator_bypass: false
  labels_visible_before_unlock: false
  workspaces_separated: true
control_pack:
  source_kind: locally_generated_synthetic_network_features
  minimum_sessions: 20
  minimum_captures: 4000
  minimum_scored_windows: 3800
  contains_real_data: false
  contains_personal_data: false
  contains_external_organization_data: false
  labels_blind: true
  independent_session_seeds: true
provenance_rules:
  generation_recipe_predeclared: true
  source_artifacts_forbidden: [real_traffic, organization_data, personal_data]
  overlap_domains: [file_sha, semantic_sha, session_id, capture_id, scenario_id, seed_id, event_fingerprint, normalized_row, temporal_sequence, derived_copy]
label_isolation:
  runtime_only: true
  inference_role_access: denied
  commitment: sha256_detached
  mutation_after_commitment: invalidates_control_pack
prediction_freeze:
  both_participants_required: true
  commitments_before_unlock: true
  mutation_after_freeze: invalidates_validation
label_unlock:
  required_roles: [control_data_custodian, evaluation_operator]
  requires_two_prediction_commitments: true
  repeat_official_inference_after_unlock: false
prediction_plan:
  order_policy: deterministic_randomized_order
  shell: false
  network: false
  arbitrary_command: false
  arbitrary_path: false
  timeout_seconds: 180
  recovery: deterministic_same_plan
metric_contract:
  metrics: [benign_recall, false_positive_rate, attack_macro_recall, attack_macro_f1, per_class_recall, per_class_precision, per_class_f1, confusion_matrix, episode_recall, episode_precision, first_detection_delay, abstention_rate, missing_predictions, duplicate_predictions, invalid_predictions]
  post_hoc_metrics: forbidden
blind_acceptance_gate:
  gate_id: blind-validation-v047-r1
  frozen_before_labels: true
  hidden_weights: false
  winner_score: false
  mandatory:
    benign_recall_min: 0.98
    false_positive_rate_max: 0.02
    attack_macro_recall_min: 0.95
    attack_macro_f1_min: 0.95
    worst_attack_recall_min: 0.90
    missing_predictions_max: 0
    duplicate_predictions_max: 0
    invalid_predictions_max: 0
    unresolved_critical_differences_max: 0
comparability:
  adapter: v0.4.5
  direct_quality_delta_requires: comparable
manual_review:
  step_count: 29
  allowed_decisions: [passed_for_registration_review, failed_validation, needs_repeat_with_new_blind_pack, invalidated_by_blindness_violation, invalidated_by_data_overlap, invalidated_by_prediction_mutation, needs_independent_human_review, withdrawn]
  candidate_registration: false
invalidation:
  - label_mutation
  - prediction_mutation
  - pre_unlock_label_access
  - data_overlap
  - post_unlock_official_inference
campaigns:
  positive_minimum: 130
  negative_minimum: 230
success:
  procedure_may_pass_when_model_fails: true
  independent_blind_validation_requires_independent_human_review: true
next_stage:
  with_independent_pass: v0.4.8
  without_independent_person: independent_human_review_required
  mainline: v0.3.19
forbidden_actions: [candidate_registration, candidate_activation, automatic_promotion, active_candidate_replacement, retraining, threshold_change, backend_integration, external_trial, production, public_bind, network, upload, arbitrary_command, git_push, git_pull, history_rewrite]
